[package]
name = "a2aid-zk-host"
version.workspace = true
edition.workspace = true

[[bin]]
name = "zkprove"
path = "src/bin/zkprove.rs"

[[bin]]
name = "zkverify"
path = "src/bin/zkverify.rs"

[dependencies]
a2aid-zk-methods = { path = "../methods" }
risc0-zkvm = { version = "3.0.6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
bincode = "1.3"

[[bin]]
name = "zkfake"
path = "src/bin/zkfake.rs"
